<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Discover mods for your AI agent. Explore the collection, copy a creation prompt, and make your agent your own." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Agentmods — Make your agent your own.</title>
    <script>
      (function(){
        try {
          var t = localStorage.getItem('agentmods:theme');
          if (t === 'light' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)) {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch(e){}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
